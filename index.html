<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Immediate console override to ensure logging filtering is active from the start -->
    <script>
      // Set up temporary console filtering until the proper module system loads
      // This provides immediate protection while modules are loading
      const originalConsole = { debug: console.debug, info: console.info, warn: console.warn, error: console.error };
      
      // Allow all logs to pass through - the module system will handle filtering
      console.info('INLINE_OVERRIDE', 'Console override disabled - debug logs enabled for debugging');
    </script>
    <script defer type="module" src="/src/utils/consoleOverride.ts"></script>
    <script defer type="module" src="/src/core/eventLoop.ts"></script>
    <script defer type="module">
      // Initialize the game after all modules are loaded
      import { initializeGame, setupPeriodicUpdates } from '/src/core/gameInitializer.ts';
      
      // Wait for DOM to be ready before initializing
      document.addEventListener('DOMContentLoaded', () => {
        // Initialize game systems
        initializeGame();
        
        // Set up periodic updates after initialization
        setupPeriodicUpdates();
      });
    </script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-gH2yIJqKdNHPEq0n4Mqa/HGKIhSkIHeL5AyhkYV8i59U5AR6csBvApHHNl/vI1Bx"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-A3rJD856KowSb7dwlZdYEkO39Gagi7vIsF0jrRAoQmDKKtQBHUuLZ9AsSv4jD4Xa"
      crossorigin="anonymous"
    ></script>

    <title>Geoasteroids</title>
    <link rel="stylesheet" href="index.css" />
  </head>

  <body>
    <div id="gameWrapper">
      <div id="start-screen" class="screen">
        <h1 class="text-center">GeoAsteroids</h1>

        <!-- Player Count Display -->
        <div class="player-count-section">
          <h4>🌐 <span id="playerCount">1</span> Players Online</h4>
        </div>

        <!-- Game Mode Selection -->
        <div class="game-modes">
          <ul class="nav flex-column">
            <li class="nav-item">
              <button id="start-multiplayer" class="btn btn-lg btn-success">
                🎮 Play
              </button>
            </li>
            <!-- Debug button - only shown in development mode -->
            <li class="nav-item" id="debug-button-container" style="display: none;">
              <button id="start-debug" class="btn btn-lg btn-warning">
                🐛 Debug
              </button>
            </li>
          </ul>
        </div>

        <!-- Settings -->
        <div class="settings">
          <h3>Settings</h3>
          <ul class="nav flex-column">
            <li class="nav-item">
              <input
                class="form-check-input"
                type="checkbox"
                value=""
                id="soundPref"
                checked
              />
              <label class="form-check-label" for="soundPref">Sound</label>
            </li>
            <li class="nav-item">
              <input
                class="form-check-input"
                type="checkbox"
                value=""
                id="musicPref"
              />
              <label class="form-check-label" for="musicPref">Music</label>
            </li>
          </ul>
        </div>



        <!-- Scroll indicator -->
        <div class="scroll-indicator">
          <span class="scroll-text">Scroll for more options</span>
          <div class="scroll-arrow">↓</div>
        </div>
      </div>

      <div id="gameArea" style="display: none">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
      </div>



      <!-- Multiplayer Name Input Modal -->
      <div id="multiplayerNameModal" class="modal" style="display: none">
        <div class="modal-content">
          <h3>🌐 Enter Your Name</h3>
          <p>Choose a name to display to other players:</p>
          <input
            type="text"
            id="multiplayerNameInput"
            maxlength="15"
            placeholder="Enter your name (max 15 characters)"
            class="form-control"
          />
          <div class="modal-buttons">
            <button id="confirmNameButton" class="btn btn-primary">Start Multiplayer</button>
            <button id="cancelNameButton" class="btn btn-secondary">Cancel</button>
          </div>
        </div>
      </div>


    </div>

    <div id="attribution">
      <a
        href="https://www.freepik.com/free-photo/starry-night-sky_7061153.htm#query=space&position=11&from_view=search"
        >Image by kjpargeter on Freepik</a
      >
      <span id="buildInfo" class="build-info"></span>
    </div>
  </body>
</html>
