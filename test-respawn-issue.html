<!DOCTYPE html>
<html>
<head>
    <title>Respawn Issue Test</title>
</head>
<body>
    <h1>Respawn Issue Test</h1>
    <div id="output"></div>
    <script>
        function log(message) {
            console.log(message);
            document.getElementById('output').innerHTML += '<div>' + message + '</div>';
        }

        // Wait for game to load
        setTimeout(() => {
            const gameController = window.gameController;
            if (!gameController) {
                log('ERROR: Game controller not found');
                return;
            }

            const localPlayer = gameController.getCurrPlayer();
            if (!localPlayer) {
                log('ERROR: Local player not found');
                return;
            }

            const ship = localPlayer.ship;
            log('Initial ship state: ' + JSON.stringify({
                health: ship.health,
                exploding: ship.exploding,
                blinkCount: ship.blinkCount,
                spawnProtectionTimer: ship.spawnProtectionTimer
            }));

            // Wait for spawn protection to end
            const checkSpawnProtection = () => {
                if (ship.blinkCount > 0) {
                    log('Still under spawn protection: blinkCount=' + ship.blinkCount + ', spawnProtectionTimer=' + ship.spawnProtectionTimer);
                    setTimeout(checkSpawnProtection, 100);
                } else {
                    log('Spawn protection ended, forcing damage...');
                    
                    // Force damage to ship
                    ship.takeDamage(100, 'test');
                    
                    log('After damage: ' + JSON.stringify({
                        health: ship.health,
                        exploding: ship.exploding,
                        blinkCount: ship.blinkCount,
                        spawnProtectionTimer: ship.spawnProtectionTimer
                    }));

                    // Check if ship respawns after explosion
                    setTimeout(() => {
                        log('After explosion time: ' + JSON.stringify({
                            health: ship.health,
                            exploding: ship.exploding,
                            blinkCount: ship.blinkCount,
                            spawnProtectionTimer: ship.spawnProtectionTimer
                        }));
                    }, 2000);
                }
            };

            checkSpawnProtection();
        }, 2000);
    </script>
</body>
</html>
