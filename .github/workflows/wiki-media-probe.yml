---
# Temporary cross-architecture probe; removed before review.
name: wiki-media-probe
'on':
  push:
    branches: [claude/hopeful-mccarthy-t1p836]
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04-arm, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/wiki-media-requirements.txt
      - run: npm ci
      - name: Render
        run: |
          node --version; uname -m; fc-list | wc -l
          start=$(date +%s)
          WIKI_MEDIA_PYTHON=python npx tsx scripts/wiki-media.ts --output probe-out 2>&1 | grep -v '"level"'
          echo "elapsed=$(( $(date +%s) - start ))s"
          (cd probe-out && sha256sum manifest.json ./*.gif ./*.png)
      - uses: actions/upload-artifact@v7
        with:
          name: probe-${{ matrix.runner }}
          path: probe-out
